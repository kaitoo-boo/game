<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>ねこちゃん どこかな？</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #FFF0F5; overflow: hidden;
            touch-action: none; display: flex; justify-content: center; align-items: center; height: 100vh;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        canvas {
            background-color: #FFF8DC;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            border-radius: 16px;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 1000 / 650;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="1000" height="650"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let gameState = 'START'; 
    let level = 1;
    let targetCat = '';
    let targetX = 0;
    let targetY = 0;
    let animals = []; 

    const cats = ['🐱', '🐈', '🐈‍⬛', '😸', '😻', '😽', '🙀', '😿', '😹'];
    const dogsAndOthers = ['🐕', '🐶', '🐩', '🦮', '🐕‍⬛', '🦊', '🐺', '🦁', '🐯', '🐻', '🐼', '🐨', '🐷', '🐸', '🐵'];

    // --- 🎵 サウンドエンジン ---
    let audioCtx = null;

    function initAudio() {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } else if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        } catch (e) {
            console.log("オーディオの初期化に失敗:", e);
        }
    }

    function playSound(type) {
        try {
            if (!audioCtx || audioCtx.state === 'suspended') return;
            const now = audioCtx.currentTime;

            if (type === 'meow') {
                // 🌟 よりリアルな猫の鳴き声（ミャーーウ）
                const osc = audioCtx.createOscillator();
                const filter = audioCtx.createBiquadFilter();
                const gain = audioCtx.createGain();

                osc.type = 'sawtooth'; // 複雑な倍音（声のざらつき）を含む波形

                // フィルター設定（口の開け閉めによる響きの変化をシミュレート）
                filter.type = 'bandpass';
                filter.Q.value = 5; // 共振を強くして「ミャ」感を出す

                // ピッチ（音程）の変化：出だしは低く、上がってから、最後に下がる
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(850, now + 0.15); // 「ヤ」で上がる
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.6);  // 「ーウ」で下がる

                // フィルターの変化：音程に合わせて開いて閉じる
                filter.frequency.setValueAtTime(800, now);
                filter.frequency.linearRampToValueAtTime(2000, now + 0.15);
                filter.frequency.linearRampToValueAtTime(600, now + 0.6);

                // 音量の変化（自然なフェードアウト）
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.4, now + 0.05);
                gain.gain.linearRampToValueAtTime(0.2, now + 0.3);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.6);
            } 
            else if (type === 'wrong') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } 
            else if (type === 'clear') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                osc.frequency.setValueAtTime(1046.50, now + 0.3);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            }
        } catch (e) {
            console.log("音の再生に失敗:", e);
        }
    }

    // --- ゲームの準備 ---
    function setupLevel() {
        animals = [];
        targetCat = cats[Math.floor(Math.random() * cats.length)];

        let animalCount = 15 + (level * 10);
        if (animalCount > 100) animalCount = 100;
        
        let minX = 60, maxX = 940, minY = 160, maxY = 600;

        for (let i = 0; i < animalCount; i++) {
            let isCat = Math.random() < 0.15;
            let emoji = '';
            if (isCat) {
                let otherCats = cats.filter(c => c !== targetCat);
                emoji = otherCats[Math.floor(Math.random() * otherCats.length)];
            } else {
                emoji = dogsAndOthers[Math.floor(Math.random() * dogsAndOthers.length)];
            }

            animals.push({
                emoji: emoji,
                x: minX + Math.random() * (maxX - minX),
                y: minY + Math.random() * (maxY - minY),
                size: 45 + Math.random() * 20,
                rotation: (Math.random() - 0.5) * 0.4
            });
        }

        targetX = minX + Math.random() * (maxX - minX);
        targetY = minY + Math.random() * (maxY - minY);
        
        animals.push({ emoji: targetCat, x: targetX, y: targetY, size: 65, rotation: 0, isTarget: true });

        let targetObj = animals.pop();
        animals.sort(() => Math.random() - 0.5);
        animals.splice(Math.floor(animals.length * 0.7), 0, targetObj);

        gameState = 'PLAY';
    }

    // --- タッチ操作 ---
    window.addEventListener("mousedown", handleTouch);
    window.addEventListener("touchstart", (e) => { e.preventDefault(); handleTouch(e); }, {passive: false});

    function handleTouch(e) {
        initAudio(); 
        const rect = canvas.getBoundingClientRect();
        let clientX = e.clientX, clientY = e.clientY;
        
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
        }

        let touchX = (clientX - rect.left) * (canvas.width / rect.width);
        let touchY = (clientY - rect.top) * (canvas.height / rect.height);

        if (gameState === 'START') {
            level = 1; setupLevel();
        } else if (gameState === 'CLEAR') {
            level++; setupLevel();
        } else if (gameState === 'PLAY') {
            if (touchY < 120) return;

            let dx = touchX - targetX, dy = touchY - targetY;
            if (Math.sqrt(dx * dx + dy * dy) < 65) {
                playSound('meow');
                setTimeout(() => playSound('clear'), 500); // ニャーとかぶらないように少し遅らせる
                gameState = 'CLEAR';
            } else {
                playSound('wrong');
            }
        }
    }

    // --- 描画ループ ---
    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = "center"; ctx.textBaseline = "middle";

        if (gameState === 'START') {
            ctx.fillStyle = "#FF8C00"; ctx.font = "bold 45px Arial"; ctx.fillText("🐾 ねこちゃん どこかな？ 🐾", 500, 280);
            ctx.fillStyle = "#555"; ctx.font = "bold 26px Arial"; ctx.fillText("画面をタッチして スタート！", 500, 380);
        } 
        else if (gameState === 'PLAY' || gameState === 'CLEAR') {
            for (let animal of animals) {
                ctx.save();
                ctx.translate(animal.x, animal.y);
                ctx.rotate(animal.rotation);
                ctx.font = animal.size + "px Arial";
                ctx.fillText(animal.emoji, 0, 0);
                ctx.restore();
            }

            ctx.fillStyle = "rgba(255, 255, 255, 0.95)"; ctx.fillRect(0, 0, canvas.width, 120);
            ctx.fillStyle = "#333"; ctx.font = "bold 26px Arial"; ctx.fillText("レベル " + level, 100, 60);
            ctx.font = "bold 32px Arial"; ctx.fillText("この ねこちゃん をさがしてね！ ➔", 480, 60);
            ctx.font = "65px Arial"; ctx.fillText(targetCat, 820, 55);

            ctx.strokeStyle = "#FFB6C1"; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(0, 120); ctx.lineTo(canvas.width, 120); ctx.stroke();

            if (gameState === 'CLEAR') {
                ctx.fillStyle = "rgba(0, 0, 0, 0.65)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#FFF"; ctx.beginPath(); ctx.arc(500, 260, 90, 0, Math.PI * 2); ctx.fill();
                ctx.font = "110px Arial"; ctx.fillText(targetCat, 500, 270);
                ctx.fillStyle = "#FFD700"; ctx.font = "bold 55px Arial"; ctx.fillText("みーつけた！ ニャー！ 🐾", 500, 420);
                ctx.fillStyle = "#FFF"; ctx.font = "bold 24px Arial"; ctx.fillText("画面をタッチして つぎのレベルへ", 500, 500);
            }
        }

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>

</body>
</html>
