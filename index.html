<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>ねこちゃん どこかな？</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #FFF0F5; overflow: hidden;
            touch-action: none; display: flex; justify-content: center; align-items: center; height: 100vh;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        canvas {
            background-color: #FFF8DC;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            border-radius: 16px;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 1000 / 650;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="1000" height="650"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let gameState = 'START'; 
    let level = 1;
    let lives = 3;
    const maxLives = 3;

    let targetCat = '';
    let targetX = 0;
    let targetY = 0;
    let animals = []; 

    const cats = ['🐱', '🐈', '🐈‍⬛', '😸', '😻', '😽', '🙀', '😿', '😹'];
    const dogsAndOthers = ['🐕', '🐶', '🐩', '🦮', '🐕‍⬛', '🦊', '🐺', '🦁', '🐯', '🐻', '🐼', '🐨', '🐷', '🐸', '🐵'];

    // --- 🎵 サウンドエンジン ---
    let audioCtx = null;

    function initAudio() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            else if (audioCtx.state === 'suspended') audioCtx.resume();
        } catch (e) { console.log("オーディオ初期化エラー"); }
    }

    function playSound(type) {
        try {
            if (!audioCtx || audioCtx.state === 'suspended') return;
            const now = audioCtx.currentTime;

            if (type === 'meow') {
                const osc = audioCtx.createOscillator();
                const filter = audioCtx.createBiquadFilter();
                const gain = audioCtx.createGain();

                osc.type = 'sawtooth';
                filter.type = 'bandpass'; filter.Q.value = 5;

                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(850, now + 0.15);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.6);

                filter.frequency.setValueAtTime(800, now);
                filter.frequency.linearRampToValueAtTime(2000, now + 0.15);
                filter.frequency.linearRampToValueAtTime(600, now + 0.6);

                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.4, now + 0.05);
                gain.gain.linearRampToValueAtTime(0.2, now + 0.3);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);

                osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.6);
            } 
            else if (type === 'wrong') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } 
            else if (type === 'clear') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                osc.frequency.setValueAtTime(1046.50, now + 0.3);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            }
            else if (type === 'gameover') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(80, now + 0.8);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.8);
                osc.start(now); osc.stop(now + 0.8);
            }
        } catch (e) {}
    }

    // --- ゲームの準備（重ならないように配置する処理） ---
    function setupLevel() {
        animals = [];
        targetCat = cats[Math.floor(Math.random() * cats.length)];

        // 無限ループを防ぐため、動物の数は最大50匹に制限
        let animalCount = 10 + (level * 5);
        if (animalCount > 50) animalCount = 50;
        
        let minX = 60, maxX = 940, minY = 160, maxY = 600;
        let positions = []; // 配置決定済みの座標リスト

        // お題の猫を含めた全動物の座標を計算
        for (let i = 0; i < animalCount + 1; i++) {
            let size = (i === 0) ? 65 : 45 + Math.random() * 15; // 0番目はお題（少し大きめ）
            
            let x, y;
            let isValid = false;
            let attempts = 0;

            // 他の動物と重ならない場所を最大100回探す
            while (!isValid && attempts < 100) {
                x = minX + Math.random() * (maxX - minX);
                y = minY + Math.random() * (maxY - minY);
                isValid = true;

                for (let pos of positions) {
                    let dx = x - pos.x;
                    let dy = y - pos.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    // 距離が近すぎたらNG（スキマを空ける）
                    if (distance < 60) {
                        isValid = false;
                        break;
                    }
                }
                attempts++;
            }

            // 見つかったら座標リストに保存
            if (isValid) {
                positions.push({ x: x, y: y, size: size, rotation: (Math.random() - 0.5) * 0.4 });
            }
        }

        // 決定した座標を使って動物を配置
        if (positions.length > 0) {
            targetX = positions[0].x;
            targetY = positions[0].y;
            animals.push({ emoji: targetCat, x: targetX, y: targetY, size: 65, rotation: positions[0].rotation, isTarget: true });
        }

        for (let i = 1; i < positions.length; i++) {
            let isCat = Math.random() < 0.15;
            let emoji = isCat ? cats.filter(c => c !== targetCat)[Math.floor(Math.random() * (cats.length - 1))] : dogsAndOthers[Math.floor(Math.random() * dogsAndOthers.length)];
            
            animals.push({
                emoji: emoji,
                x: positions[i].x,
                y: positions[i].y,
                size: positions[i].size,
                rotation: positions[i].rotation
            });
        }

        // 描画順をランダムに
        animals.sort(() => Math.random() - 0.5);
        gameState = 'PLAY';
    }

    // --- タッチ操作とライフ計算 ---
    window.addEventListener("mousedown", handleTouch);
    window.addEventListener("touchstart", (e) => { e.preventDefault(); handleTouch(e); }, {passive: false});

    function handleTouch(e) {
        initAudio(); 
        const rect = canvas.getBoundingClientRect();
        let clientX = e.clientX, clientY = e.clientY;
        
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
        }

        let touchX = (clientX - rect.left) * (canvas.width / rect.width);
        let touchY = (clientY - rect.top) * (canvas.height / rect.height);

        if (gameState === 'START' || gameState === 'GAMEOVER') {
            level = 1; 
            lives = maxLives;
            setupLevel();
        } else if (gameState === 'CLEAR') {
            level++; 
            setupLevel();
        } else if (gameState === 'PLAY') {
            if (touchY < 120) return; // メニューバーのタッチは無視

            let dx = touchX - targetX, dy = touchY - targetY;
            if (Math.sqrt(dx * dx + dy * dy) < 65) {
                // 正解！
                playSound('meow');
                setTimeout(() => playSound('clear'), 500);
                gameState = 'CLEAR';
            } else {
                // 不正解！ライフが減る
                playSound('wrong');
                lives--;
                if (lives <= 0) {
                    playSound('gameover');
                    gameState = 'GAMEOVER';
                }
            }
        }
    }

    // --- 描画ループ ---
    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = "center"; ctx.textBaseline = "middle";

        if (gameState === 'START') {
            ctx.fillStyle = "#FF8C00"; ctx.font = "bold 45px Arial"; ctx.fillText("🐾 ねこちゃん どこかな？ 🐾", 500, 280);
            ctx.fillStyle = "#555"; ctx.font = "bold 26px Arial"; ctx.fillText("画面をタッチして スタート！", 500, 380);
        } 
        else if (gameState === 'PLAY' || gameState === 'CLEAR' || gameState === 'GAMEOVER') {
            for (let animal of animals) {
                ctx.save();
                ctx.translate(animal.x, animal.y);
                ctx.rotate(animal.rotation);
                ctx.font = animal.size + "px Arial";
                ctx.fillText(animal.emoji, 0, 0);
                ctx.restore();
            }

            // メニューバー
            ctx.fillStyle = "rgba(255, 255, 255, 0.95)"; ctx.fillRect(0, 0, canvas.width, 120);
            
            ctx.fillStyle = "#333"; ctx.font = "bold 24px Arial"; 
            ctx.fillText("レベル " + level, 80, 60);
            
            // ライフ表示（ハート）
            ctx.fillStyle = "#FF3366";
            let heartStr = "❤️".repeat(Math.max(0, lives)) + "🤍".repeat(Math.max(0, maxLives - lives));
            ctx.fillText("ライフ: " + heartStr, 250, 60);

            ctx.fillStyle = "#333"; ctx.font = "bold 28px Arial"; 
            ctx.fillText("この ねこちゃん をさがしてね！ ➔", 580, 60);
            ctx.font = "65px Arial"; ctx.fillText(targetCat, 880, 55);

            ctx.strokeStyle = "#FFB6C1"; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(0, 120); ctx.lineTo(canvas.width, 120); ctx.stroke();

            // クリア画面
            if (gameState === 'CLEAR') {
                ctx.fillStyle = "rgba(0, 0, 0, 0.65)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#FFF"; ctx.beginPath(); ctx.arc(500, 260, 90, 0, Math.PI * 2); ctx.fill();
                ctx.font = "110px Arial"; ctx.fillText(targetCat, 500, 270);
                ctx.fillStyle = "#FFD700"; ctx.font = "bold 55px Arial"; ctx.fillText("みーつけた！ ニャー！ 🐾", 500, 420);
                ctx.fillStyle = "#FFF"; ctx.font = "bold 24px Arial"; ctx.fillText("画面をタッチして つぎのレベルへ", 500, 500);
            }
            // ゲームオーバー画面
            else if (gameState === 'GAMEOVER') {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#FF3366"; ctx.font = "bold 60px Arial"; ctx.fillText("ゲームオーバー...", 500, 250);
                ctx.fillStyle = "#FFD700"; ctx.font = "bold 36px Arial"; ctx.fillText("きろく： レベル " + level, 500, 360);
                ctx.fillStyle = "#FFF"; ctx.font = "bold 24px Arial"; ctx.fillText("画面をタッチして さいしょから あそぶ", 500, 480);
            }
        }

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>

</body>
</html>
